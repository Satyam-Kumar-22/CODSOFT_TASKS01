
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
        <h1>Task<span>Flow.</span></h1>
        <p class="subtitle">Plan your day. Get things done.</p>
      </div>
      <div class="date-box">
        <span id="dayName"></span>
        <strong id="todayDate"></strong>
      </div>
    </header>

    <section class="stats">
      <article class="stat-card">
        <span>Total Tasks</span>
        <strong id="totalCount">0</strong>
      </article>
      <article class="stat-card">
        <span>Pending</span>
        <strong id="pendingCount">0</strong>
      </article>
      <article class="stat-card">
        <span>Completed</span>
        <strong id="completedCount">0</strong>
      </article>
    </section>

    <section class="task-panel">
      <h2 id="formTitle">Add a New Task</h2>

      <form id="taskForm">
        <label for="taskInput">Task name</label>
        <input id="taskInput" type="text"
          placeholder="e.g. Complete internship task"
          maxlength="120" required>

        <div class="form-row">
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="Personal">Personal</option>
              <option value="Study">Study</option>
              <option value="Work">Work</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <div class="field">
            <label for="dueDate">Due date</label>
            <input id="dueDate" type="date">
          </div>
        </div>

        <div class="form-actions">
          <button class="primary-btn" type="submit" id="submitBtn">
            + Add Task
          </button>
          <button class="secondary-btn hidden" type="button" id="cancelEdit">
            Cancel
          </button>
        </div>
        <p id="formMessage" role="status"></p>
      </form>
    </section>

    <section class="list-section">
      <div class="list-heading">
        <div>
          <h2>My Tasks</h2>
          <p>Stay focused on what matters.</p>
        </div>
        <button id="themeToggle" class="theme-btn" type="button"
          aria-label="Toggle dark mode">☾ Theme</button>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search"
          placeholder="Search tasks..." aria-label="Search tasks">

        <select id="statusFilter" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>

        <select id="categoryFilter" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option value="Personal">Personal</option>
          <option value="Study">Study</option>
          <option value="Work">Work</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div id="taskList" class="task-list"></div>
      <p id="emptyState" class="empty-state">
        No tasks yet. Add your first task above!
      </p>
    </section>

    <footer>
      <p>Made with focus & consistency.</p>
      <button id="clearCompleted" class="clear-btn" type="button">
        Clear completed
      </button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
